<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baccarat Pattern Matcher & Entry Filter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Header -->
    <header class="w-full max-w-md text-center py-4">
        <h1 class="text-xl font-bold tracking-wider text-emerald-400">AI BACCARAT FILTER</h1>
        <p class="text-xs text-slate-400">ระบบฐานข้อมูลขอน & กรองจังหวะอัจฉริยะ</p>
    </header>

    <!-- Main Dashboard -->
    <main class="w-full max-w-md bg-slate-800 rounded-2xl p-5 shadow-xl border border-slate-700 flex flex-col gap-4">
        
        <!-- Signal Display (Traffic Light) -->
        <div id="signal-box" class="p-4 rounded-xl text-center bg-slate-700 border border-slate-600 transition-all">
            <span id="signal-text" class="text-lg font-bold text-slate-300">⏳ กรุณาบันทึกผล (เริ่มตาที่ 6 ขึ้นไป)</span>
            <div id="recommendation" class="text-sm mt-1 text-slate-400">รอข้อมูลนำเข้า...</div>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-2 gap-3 text-center">
            <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700">
                <div class="text-xs text-slate-400">ความน่าจะเป็น Banker</div>
                <div id="prob-b" class="text-xl font-bold text-red-400">50.0%</div>
            </div>
            <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700">
                <div class="text-xs text-slate-400">ความน่าจะเป็น Player</div>
                <div id="prob-p" class="text-xl font-bold text-blue-400">50.0%</div>
            </div>
        </div>

        <!-- Sequence History View -->
        <div>
            <div class="text-xs text-slate-400 mb-1 flex justify-between">
                <span>ประวัติผลลัพธ์ปัจจุบัน (<span id="hand-count">0</span> ตา)</span>
                <span id="matched-info" class="text-emerald-400">Matched: 0 ขอน</span>
            </div>
            <div id="history-box" class="w-full h-20 bg-slate-900 rounded-lg p-2 overflow-x-auto flex items-center gap-2 border border-slate-700 text-xs">
                <span class="text-slate-500 italic">ยังไม่มีข้อมูล...</span>
            </div>
        </div>

        <!-- Control Buttons (Banker / Player / Tie) -->
        <div class="grid grid-cols-3 gap-2 pt-2">
            <button onclick="addResult('B')" class="bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-xl shadow-lg transition active:scale-95">BANKER (B)</button>
            <button onclick="addResult('P')" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg transition active:scale-95">PLAYER (P)</button>
            <button onclick="addResult('T')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition active:scale-95">TIE (T)</button>
        </div>

        <!-- Action Utilities -->
        <div class="flex gap-2">
            <button onclick="undoResult()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-xs py-2 rounded-lg text-slate-300 transition">ย้อนกลับ (Undo)</button>
            <button onclick="resetGame()" class="flex-1 bg-rose-900/40 hover:bg-rose-900/60 text-xs py-2 rounded-lg text-rose-300 transition">ล้างกระดาน (Reset)</button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-md text-center py-4 text-xs text-slate-500">
        Powered by Supabase & Smart Entry Filter Architecture
    </footer>

    <!-- Frontend Script Logic -->
    <script>
        // ตั้งค่าเชื่อมต่อ Supabase ของคุณ
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentSequence = [];

        async function addResult(result) {
            currentSequence.push(result);
            updateUIHistory();
            await analyzePattern();
        }

        function undoResult() {
            currentSequence.pop();
            updateUIHistory();
            if (currentSequence.length >= 6) {
                analyzePattern();
            } else {
                resetSignalUI();
            }
        }

        function resetGame() {
            currentSequence = [];
            updateUIHistory();
            resetSignalUI();
        }

        function updateUIHistory() {
            document.getElementById('hand-count').innerText = currentSequence.length;
            const historyBox = document.getElementById('history-box');
            if (currentSequence.length === 0) {
                historyBox.innerHTML = '<span class="text-slate-500 italic">ยังไม่มีข้อมูล...</span>';
                return;
            }
            historyBox.innerHTML = currentSequence.map(item => {
                let bg = item === 'B' ? 'bg-red-600' : (item === 'P' ? 'bg-blue-600' : 'bg-emerald-600');
                return `<div class="w-7 h-7 rounded-full flex items-center justify-center font-bold text-white shrink-0 ${bg}">${item}</div>`;
            }).join('');
            historyBox.scrollLeft = historyBox.scrollWidth;
        }

        function resetSignalUI() {
            const box = document.getElementById('signal-box');
            box.className = "p-4 rounded-xl text-center bg-slate-700 border border-slate-600 transition-all";
            document.getElementById('signal-text').innerText = "⏳ กรุณาบันทึกผล (เริ่มตาที่ 6 ขึ้นไป)";
            document.getElementById('recommendation').innerText = "รอข้อมูลนำเข้า...";
            document.getElementById('prob-b').innerText = "50.0%";
            document.getElementById('prob-p').innerText = "50.0%";
            document.getElementById('matched-info').innerText = "Matched: 0 ขอน";
        }

        async function analyzePattern() {
            if (currentSequence.length < 6) return;
            
            const patternString = currentSequence.join(',');

            // เรียกใช้งาน SQL Function บน Supabase RPC
            const { data, error } = await _supabase.rpc('analyze_baccarat_system', {
                input_pattern: patternString
            });

            if (error) {
                console.error("Supabase Error:", error);
                return;
            }

            if (data && data.length > 0) {
                const res = data[0];
                document.getElementById('prob-b').innerText = res.prob_banker + '%';
                document.getElementById('prob-p').innerText = res.prob_player + '%';
                document.getElementById('matched-info').innerText = `Matched: ${res.match_count} ขอน`;

                const box = document.getElementById('signal-box');
                const signalText = document.getElementById('signal-text');
                const recommendation = document.getElementById('recommendation');

                if (res.signal_status.startsWith('ENTER_BET')) {
                    box.className = "p-4 rounded-xl text-center bg-emerald-900/60 border border-emerald-500 transition-all shadow-lg shadow-emerald-900/20";
                    signalText.innerText = `🎯 สั่งลุย: แทง [${res.recommended_side}]`;
                    recommendation.innerText = res.signal_status;
                } else {
                    box.className = "p-4 rounded-xl text-center bg-slate-800 border border-amber-500/50 transition-all";
                    signalText.innerText = `⛔ NO BET (ระบบสั่งหยุด/รอ)`;
                    recommendation.innerText = res.signal_status;
                }
            }
        }
    </script>
</body>
</html>
